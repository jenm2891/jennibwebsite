name: Deploy Commerce API Worker

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/commerce-api/**
      - .github/workflows/deploy-commerce-api.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deploy secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "Missing required GitHub secret: CF_API_TOKEN"
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Missing required GitHub secret: CF_ACCOUNT_ID"
            exit 1
          fi

      - name: Verify Wrangler CLI
        run: npx --yes wrangler@4 --version

      - name: Verify Cloudflare auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 whoami

      - name: Validate D1 configuration
        run: |
          if grep -q "REPLACE_WITH_D1_DATABASE_ID" cloudflare/commerce-api/wrangler.jsonc; then
            echo "Replace REPLACE_WITH_D1_DATABASE_ID in cloudflare/commerce-api/wrangler.jsonc before deploy."
            exit 1
          fi

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply jennib-blog --remote --config cloudflare/commerce-api/wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/commerce-api/wrangler.jsonc